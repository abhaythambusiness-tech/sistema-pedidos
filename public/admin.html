<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panel admin — Restaurante Demo</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
  <header class="topbar"><div class="topbar__inner"><a class="brand" href="admin.html">⚙️ <span>Panel admin</span></a><nav class="topbar__nav"><a href="index.html" class="link">Ver sitio</a><span id="user-badge" class="tag">—</span><button id="logout-btn" class="btn btn-ghost">Salir</button></nav></div></header>
  <main class="container">
    <div id="low-stock-banner" class="low-stock-banner"></div>
    <div class="tabs"><button class="tab is-active" data-target="tab-inventory">Inventario</button><button class="tab" data-target="tab-products">Productos</button><button class="tab" data-target="tab-orders">Pedidos</button><button class="tab" data-target="tab-movements">Movimientos</button><button class="tab" data-target="tab-settings">Ajustes</button></div>
    <section class="tab-panel is-active" id="tab-inventory"><h2>Inventario</h2><div class="table-wrap"><table class="table"><thead><tr><th>Ingrediente</th><th>Stock</th><th>Ajustar</th><th>Umbral</th></tr></thead><tbody id="inventory-body"></tbody></table></div></section>
    <section class="tab-panel" id="tab-products"><h2>Productos</h2><div class="product-grid product-grid--admin" id="products-admin"></div></section>
    <section class="tab-panel" id="tab-orders"><h2>Pedidos</h2><div id="orders-list"></div></section>
    <section class="tab-panel" id="tab-movements"><h2>Movimientos</h2><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Ingrediente</th><th>Delta</th><th>Motivo</th><th>Pedido</th></tr></thead><tbody id="movements-body"></tbody></table></div></section>
    <section class="tab-panel" id="tab-settings"><h2>Ajustes</h2><label class="field"><span>Nombre</span><input type="text" id="setting-name"></label><label class="field"><span>Alerta cliente (unidades)</span><input type="number" id="setting-alert" min="1" max="50"></label><button id="save-settings" class="btn btn-primary">Guardar</button></section>
  </main>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script><script src="js/admin.js"></script>
</body>
</html>
