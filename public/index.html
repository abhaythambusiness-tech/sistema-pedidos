<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos — Restaurante Demo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar"><div class="topbar__inner"><a class="brand" href="index.html">🍔 <span>Restaurante Demo</span></a><nav class="topbar__nav"><a href="admin.html" class="link">Panel admin</a><button id="open-cart" class="btn btn-primary cart-btn">🛒 Pedido <span class="badge" id="cart-count">0</span></button></nav></div></header>
  <main class="container"><section class="hero"><h1>Pide tu comida favorita</h1><p class="muted">Arma tu pedido, personalízalo y lo enviamos directo a la cocina.</p></section><section class="product-grid" id="product-grid"></section></main>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="cart-drawer" id="cart-drawer"><div class="cart-drawer__header"><h2>Tu pedido</h2><button class="modal-close" id="close-cart">✕</button></div><div class="cart-drawer__body" id="cart-items"></div><div class="cart-drawer__footer"><label class="field"><span>Tu nombre (opcional)</span><input type="text" id="customer-name" placeholder="Ej: Ana"></label><div class="cart-total-row"><span>Total</span><b id="cart-total">$0.00</b></div><button id="checkout-btn" class="btn btn-primary btn-block" disabled>Confirmar pedido</button></div></aside>
  <div id="toast-container" class="toast-container"></div>
  <script src="js/api.js"></script><script src="js/client.js"></script>
</body>
</html>
